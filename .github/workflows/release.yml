name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fyne dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Install Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            $mingw = "C:\ProgramData\mingw64\mingw64\bin"
            $env:PATH = "$mingw;$env:PATH"
            $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          gcc --version
          windres --version

      - name: Build Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = go env GOARCH
          $name = "r2go-windows-$arch"
          $stage = "dist\$name"

          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Push-Location assets
          windres -i r2go.rc -o ..\cmd\r2go\r2go_windows.syso -O coff
          Pop-Location

          go build -trimpath -ldflags "-H=windowsgui -s -w" -o "$stage\r2go.exe" ./cmd/r2go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item README.md, LICENSE, CHANGELOG.md -Destination $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\$name.zip"

      - name: Build Unix release
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          os="$(go env GOOS)"
          arch="$(go env GOARCH)"
          name="r2go-${os}-${arch}"
          stage="dist/${name}"

          mkdir -p "$stage"
          go build -trimpath -ldflags "-s -w" -o "$stage/r2go" ./cmd/r2go
          cp README.md LICENSE CHANGELOG.md "$stage/"
          tar -C dist -czf "dist/${name}.tar.gz" "$name"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: r2go-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: R2GO ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: dist/*
          fail_on_unmatched_files: true
