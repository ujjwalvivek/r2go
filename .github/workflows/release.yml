name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            pkg-config \
            libgl1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev

      - name: Download Go modules
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...


  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install MinGW
        shell: powershell
        run: |
          choco install mingw -y --no-progress
          gcc --version

      - name: Download Go modules
        run: go mod download

      - name: Build
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          go build `
            -trimpath `
            -ldflags="-s -w -H=windowsgui" `
            -o dist\r2go.exe `
            ./cmd/r2go

      - name: Package
        shell: powershell
        run: |
          Compress-Archive `
            -Path dist\r2go.exe, README.md, LICENSE `
            -DestinationPath "r2go-${{ github.ref_name }}-windows-amd64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: r2go-${{ github.ref_name }}-windows-amd64.zip
          if-no-files-found: error


  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            pkg-config \
            libgl1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev

      - name: Download Go modules
        run: go mod download

      - name: Build
        run: |
          mkdir -p dist

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/r2go \
            ./cmd/r2go

      - name: Package
        run: |
          tar -czf "r2go-${GITHUB_REF_NAME}-linux-amd64.tar.gz" \
            -C dist r2go \
            -C .. README.md LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: r2go-${{ github.ref_name }}-linux-amd64.tar.gz
          if-no-files-found: error


  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Build
        run: |
          mkdir -p dist

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/r2go \
            ./cmd/r2go

      - name: Package
        run: |
          tar -czf "r2go-${GITHUB_REF_NAME}-macos-arm64.tar.gz" \
            -C dist r2go \
            -C .. README.md LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: r2go-${{ github.ref_name }}-macos-arm64.tar.gz
          if-no-files-found: error


  release:
    name: Create GitHub Release
    needs:
      - build-windows
      - build-linux
      - build-macos

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Show release files
        run: ls -lah release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: R2GO ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            release/*.zip
            release/*.tar.gz
          fail_on_unmatched_files: true